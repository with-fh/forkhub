name: Deploy web

# CD for forkhub.imbios.dev (Cloudflare Workers via opennext).
# Pushes to the web branch deploy; anything else is verify-only.
# Required repo secrets: CLOUDFLARE_API_TOKEN (Workers deploy permission),
# CLOUDFLARE_ACCOUNT_ID. Catalog reads use the automatic github.token.

on:
  push:
    branches: [t3code/drop-cli-desktop-keep-web-skill]
    paths:
      - "apps/web/**"
      - "packages/api/src/oss/**"
      - "packages/ui/**"
      - "packages/env/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - name: Web unit tests
        run: bun test ./apps/web/src/lib/releases.test.ts
        working-directory: .
      - name: Lint changed web files
        run: pnpm oxlint apps/web/src/lib apps/web/src/app/download
        working-directory: .

  deploy:
    needs: test-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SERVER_URL: https://forkhub.imbios.dev
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check deploy secrets
        run: |
          missing=0
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Missing repo secret: $s"; missing=1; fi
          done
          # Fail loudly (not silently skip): an undeployed merge must be visible.
          exit $missing
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build worker
        run: OPENNEXT=1 pnpm exec opennextjs-cloudflare build
        working-directory: apps/web
      - name: Upload version
        id: upload
        run: |
          OPENNEXT=1 pnpm exec opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $NF}' | tail -1)
          if [ -z "$VERSION" ]; then echo "::error::Could not parse worker version ID"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - name: Shift traffic to 100%
        # opennext uploads a version but leaves traffic pinned: without this
        # step the site silently keeps serving the old build.
        run: pnpm exec wrangler versions deploy ${{ steps.upload.outputs.version }} --percentage 100 --name forkhub-web
        working-directory: apps/web
      - name: Smoke test production
        # NOTE: forkhub.imbios.dev sits behind Cloudflare bot challenge, which
        # blocks GitHub-runner curl with a "Just a moment..." 403. Real
        # browsers pass it (verified manually), so content assertions run
        # against the workers.dev URL (same worker, no challenge), while the
        # custom domain gets a route-alive check (200/307, or the challenge
        # page itself proving zone routing works).
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          DEV="https://forkhub-web.imbios.workers.dev"
          code=""
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -A "$UA" -o /tmp/latest-head -w '%{http_code}' --max-time 60 "$DEV/download/natively/latest?channel=stable")
            if [ "$code" = "307" ]; then break; fi
            echo "attempt $i: /latest HTTP $code — $(head -c 200 /tmp/latest-head)"
            sleep 20
          done
          if [ "$code" != "307" ]; then echo "::error::/latest returned $code, want 307"; exit 1; fi
          for slug in natively t3code; do
            tries=0
            until curl -s -A "$UA" --max-time 60 "$DEV/download/$slug" | grep -q 'aria-label="Version"'; do
              tries=$((tries + 1))
              if [ "$tries" -ge 6 ]; then echo "::error::version picker missing on $slug page"; exit 1; fi
              sleep 20
            done
          done
          # Custom domain: route-alive (challenge page counts — it proves
          # zone routing; browsers pass it, verified manually with screenshots).
          for slug in natively t3code; do
            body=$(curl -s -A "$UA" --max-time 60 "https://forkhub.imbios.dev/download/$slug")
            if echo "$body" | grep -q 'aria-label="Version"'; then
              echo "$slug: live with new UI"
            elif echo "$body" | grep -q 'Just a moment'; then
              echo "$slug: route alive (edge challenge for runner egress, browsers pass)"
            else
              echo "::error::$slug page unexpected content"; exit 1;
            fi
          done
          echo "Production smoke test passed."
